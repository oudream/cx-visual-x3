name: CxVisual MDS RuntimeData Lifecycle Windows Acceptance
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Mechanism/Data/RuntimeData/**'
      - 'Mechanism/Data/CxVisual.Mechanism.Data.csproj'
      - 'Mechanism/Runtime/Execution/MRKExecutionEngine.cs'
      - 'Mechanism/Runtime/Execution/MRKExecutionPlan.cs'
      - 'Mechanism/Runtime/Execution/MRKExecutionPolicy.cs'
      - 'Mechanism/Runtime/Execution/MRKRuntimeSession.cs'
      - 'Mechanism/Presentation.Wpf/RuntimeData/**'
      - 'Applications/Studio/StudioShell.RuntimeData.cs'
      - 'Tests/ArchitectureSmoke/Runtime/Data/**'
      - 'Tests/ArchitectureSmoke/Program.cs'
      - 'Tests/TestCenter/Automated/Cases/TCTRuntimeDataUsabilityCases.cs'
      - 'Tests/TestCenter/Manual/RuntimeData/**'
      - 'Tests/TestCenter/CxVisual.TestCenter.csproj'
      - 'Tests/TestCenter/App.xaml.cs'
      - 'DOCS/Architecture/CxVisual_数据与交互体系#2运行时数据体系——完整设计与验收_V3.0.md'
      - '.github/workflows/runtime-data-lifecycle-windows.yml'
jobs:
  mds-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore Studio and TestCenter pinned packages
        shell: pwsh
        run: |
          $m = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $m .\Tests\TestCenter\CxVisual.TestCenter.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'TestCenter restore failed' }
          & $m .\Applications\Studio\CxVisual.Studio.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Studio restore failed' }
      - name: Full Windows .NET48 Release x64 build
        shell: pwsh
        run: |
          $m = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $m .\CxVisual.Unified.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'MDS lifecycle build failed' }
      - name: Run real MDS lifecycle, storage, hardening, compiler
        shell: pwsh
        run: |
          for ($pass=1; $pass -le 3; $pass++) {
            $log = "Output/Release/x64/mds-p1-architecture-pass$pass.log"
            & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --runtime-data-lifecycle | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "MDS architecture P1 repeated pass $pass failed" }
          }
          Write-Host 'PASS MDS P1 architecture 3 independent processes'
      - name: Run five isolated TestCenter lifecycle cases
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\Output\Release\x64\CxVisual.TestCenter.exe').Path
          foreach ($id in @('TCT.MDS.030', 'TCT.MDS.031', 'TCT.MDS.032', 'TCT.MDS.033', 'TCT.MDS.034')) {
            $rounds = if ($id -eq 'TCT.MDS.033') { 5 } else { 1 }
            for ($pass=1; $pass -le $rounds; $pass++) {
              $report = Join-Path (Get-Location) ("Output/Release/x64/" + $id + ".pass" + $pass + ".junit.xml")
              $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id',('"' + $id + '"'),'--report',('"' + $report + '"'),'--format','junit','--isolate') -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "TestCenter $id pass $pass failed: $($p.ExitCode)" }
              [xml]$xml = Get-Content -LiteralPath $report -Raw
              if ([int]$xml.testsuite.tests -ne 1 -or [int]$xml.testsuite.failures -ne 0 -or [int]$xml.testsuite.errors -ne 0) {
                throw "TestCenter $id pass $pass returned non-passing JUnit"
              }
            }
          }
          Write-Host 'PASS TCT.MDS.030/031/032/034 once, P1 TCT.MDS.033 five independent processes'
      - name: Run MDS lifecycle logical-budget soak and p95-p99 metrics
        shell: pwsh
        run: |
          $report = 'Output/Release/x64/mds-lifecycle-soak.log'
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --runtime-data-soak 20000 | Tee-Object -FilePath $report
          if ($LASTEXITCODE -ne 0) { throw 'MDS lifecycle soak failed' }
      - name: Run real STA WPF lifecycle workspace
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\Output\Release\x64\CxVisual.TestCenter.exe').Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--data-lifecycle-ui-smoke') -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $err = Join-Path $env:TEMP 'CxVisual-Data-Lifecycle-WPF-Error.txt'
            if (Test-Path $err) { Get-Content -LiteralPath $err | Write-Host }
            throw 'MDS five-dimension real WPF UI failure'
          }
          Write-Host 'PASS MDS lifecycle five-dimension WPF workspace'
      - name: Save MDS lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxvisual-mds-lifecycle-evidence
          path: |
            Output/Release/x64/TCT.MDS.*.junit.xml
            Output/Release/x64/mds-p1-architecture-pass*.log
            Output/Release/x64/mds-lifecycle-soak.log
          if-no-files-found: warn
