name: TestCenter Windows .NET48
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Tests/TestCenter/**'
      - 'Applications/Studio/**'
      - 'Foundation/**'
      - 'Mechanism/**'
      - 'CxVisual.Unified.sln'
      - 'Build/**'
      - '.github/workflows/testcenter-windows.yml'

jobs:
  windows-testcenter:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Verify project structure
        shell: powershell
        run: ./Build/Verify-Structure.ps1
      - name: Verify layer ownership and project DAG
        shell: powershell
        run: ./Build/Verify-OwnerDependencies.ps1
      - name: Restore pinned NUnit packages
        shell: powershell
        run: |
          & msbuild 'Tests/TestCenter/CxVisual.TestCenter.csproj' /t:Restore /p:Configuration=Debug /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "NuGet PackageReference restore failed" }
      - name: Restore Studio package references before full Rebuild
        shell: powershell
        run: |
          & msbuild 'Applications/Studio/CxVisual.Studio.csproj' /t:Restore /p:Configuration=Debug /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Studio AvalonDock NuGet Restore failed" }
      - name: Verify new test source requires no project edit
        shell: powershell
        run: |
          @'
          using CxVisual.TestCenter.Core;
          using CxVisual.TestCenter.Discovery;
          namespace CxVisual.TestCenter.Cases
          {
              public static class TCTAutodiscoveredCases
              {
                  [TCTTest("TCT.AUTO.001", "Dynamic source auto discovery", TCTTestAspect.Foundation, "Development")]
                  public static void Check(TCTTestContext test)
                  {
                      test.AssertEqual(42, 6 * 7, "Compile wildcard and discover");
                  }
              }
          }
          '@ | Set-Content -LiteralPath 'Tests/TestCenter/Automated/Cases/TCTAutodiscoveredCases.generated.cs' -Encoding UTF8
          Write-Host 'Created .cs source after checkout; project file unchanged'
          @'
          using System.Threading.Tasks;
          using NUnit.Framework;
          namespace CxVisual.TestCenter.Cases
          {
              [TestFixture]
              public sealed class TCTNewNUnit
              {
                  [Test]
                  public async Task AsyncComputation()
                  {
                      await Task.Yield();
                      Assert.That(6 * 7, Is.EqualTo(42));
                  }
                  [TestCase(2, 3, 5)]
                  [TestCase(3, 4, 7)]
                  public void ParameterComputation(int a, int b, int expected)
                  {
                      Assert.That(a + b, Is.EqualTo(expected));
                  }
              }
          }
          '@ | Set-Content -LiteralPath 'Tests/TestCenter/Automated/Cases/TCTNewNUnit.generated.cs' -Encoding UTF8
          Write-Host 'Created native NUnit async/parameterized source after checkout; csproj unchanged'
      - name: Build all solution projects
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force 'Output/Debug/x64' | Out-Null
          & msbuild 'CxVisual.Unified.sln' /m:1 /t:Rebuild /p:Configuration=Debug /p:Platform=x64 /nologo /v:minimal "/flp:logfile=Output/Debug/x64/Build.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
      - name: Verify developer catalog and stable Case/Definition identities
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $manifest = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter.catalog.json'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--list','--report',('"' + $manifest + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Developer catalog --list failed: $($p.ExitCode)" }
          $data = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $items = @($data.cases)
          if ($items.Count -lt 90 -or [int]$data.count -ne $items.Count) {
              throw "Catalog incomplete: $($items.Count)"
          }
          $ids = @($items | ForEach-Object { [string]$_.id })
          if (@($ids | Select-Object -Unique).Count -ne $items.Count) {
              throw 'Duplicate Catalog CaseIds'
          }
          $rows = @($items | Where-Object { $_.rowKey -ne 'default' -and $_.id -like 'NUNIT.*' })
          if ($rows.Count -lt 2 -or @($rows | Where-Object {
              [string]::IsNullOrWhiteSpace([string]$_.fingerprint)
          }).Count -ne 0) { throw 'NUnit parameter rows lack stable fingerprint' }
          $authored = @($items | Where-Object {
              $_.id -like 'NUNIT.CxVisual.TestCenter.Cases.TCTNewNUnit.*'
          })
          if ($authored.Count -ne 3 -or
              @($authored | Where-Object { [string]::IsNullOrWhiteSpace($_.fingerprint) }).Count -ne 0) {
              throw "Dynamically authored NUnit cases were not compiled/discovered with fingerprints"
          }
          $asyncId = 'NUNIT.CxVisual.TestCenter.Cases.TCTNewNUnit.AsyncComputation'
          if (@($authored | Where-Object { $_.id -eq $asyncId }).Count -ne 1 -or
              @($authored | Where-Object { $_.rowKey -ne 'default' }).Count -ne 2) {
              throw "Async test and parameter rows not independently represented"
          }
          Write-Host "PASS Developer catalog discovered $($items.Count) cases including 3 authored NUnit cases"
      - name: Verify new NUnit test runs by TestId without registration
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $id = 'NUNIT.CxVisual.TestCenter.Cases.TCTNewNUnit.AsyncComputation'
          $report = Join-Path (Get-Location) 'Output/Debug/x64/M1NUnitAuthor.junit.xml'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id',('"' + $id + '"'),'--report',('"' + $report + '"'),'--format','junit','--isolate') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Dynamic authored NUnit worker returned $($p.ExitCode)" }
          [xml]$junit = Get-Content -LiteralPath $report -Raw
          if ([int]$junit.testsuite.tests -ne 1 -or
              [int]$junit.testsuite.failures -ne 0 -or
              [int]$junit.testsuite.errors -ne 0 -or
              [string]$junit.testsuite.testcase.GetAttribute('name') -ne $id) {
              throw "Developer NUnit test identity or final result not preserved"
          }
          Write-Host 'PASS new NUnit async test: source -> build -> discovery -> Worker -> JUnit'
      - name: Verify actual WPF Shell and Viewer binding
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--ui-smoke') -PassThru
          try { Wait-Process -Id $p.Id -Timeout 45 -ErrorAction Stop }
          catch {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw 'WPF Shell smoke process timed out'
          }
          $p.Refresh()
          if ($p.ExitCode -ne 0) {
              $err = Join-Path ([System.IO.Path]::GetTempPath()) 'CxVisual-TestCenter-HostError.txt'
              if (Test-Path $err) { Get-Content -LiteralPath $err | Write-Host }
              throw "WPF Shell smoke returned $($p.ExitCode)"
          }
          Write-Host 'PASS WPF Shell binds real TCT result and ordered events'
      - name: Verify isolated Connector UIA PointTable and DataMapping
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $stage = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter-UIA-Stages.log'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--connector-ui-automation') -PassThru
          try { Wait-Process -Id $p.Id -Timeout 50 -ErrorAction Stop }
          catch {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $stage) { Get-Content -LiteralPath $stage | Write-Host }
              throw 'Connector UIA blocked; actual stage is above'
          }
          $p.Refresh()
          if ($p.ExitCode -ne 0) {
              $err = Join-Path ([System.IO.Path]::GetTempPath()) 'CxVisual-TestCenter-HostError.txt'
              if (Test-Path $err) { Get-Content -LiteralPath $err | Write-Host }
              if (Test-Path $stage) { Get-Content -LiteralPath $stage | Write-Host }
              throw "Connector UIA failed: $($p.ExitCode)"
          }
          if (-not (Test-Path 'Output/Debug/x64/TestCenter-Connector-UIA.png')) {
              throw 'Connector actual WPF screenshot missing'
          }
          Write-Host 'PASS isolated Connector PointTable/DataMapping real UIA and screenshot'
      - name: Verify real Windows UI Automation user workflow
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $screenshot = Join-Path (Get-Location) 'Output/Debug/x64/TestCenterUIA.png'
          if (Test-Path $screenshot) { Remove-Item $screenshot -Force }
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--ui-automation') -PassThru
          try { Wait-Process -Id $p.Id -Timeout 240 -ErrorAction Stop }
          catch {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $stage = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter-UIA-Stages.log'
              if (Test-Path $stage) { Get-Content -LiteralPath $stage | Write-Host }
              throw 'Windows UI Automation TestCenter interaction timed out; see last stage above'
          }
          $p.Refresh()
          if ($p.ExitCode -ne 0) {
              $err = Join-Path ([System.IO.Path]::GetTempPath()) 'CxVisual-TestCenter-HostError.txt'
              if (Test-Path $err) { Get-Content $err | Write-Host }
              $stage = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter-UIA-Stages.log'
              if (Test-Path $stage) { Get-Content -LiteralPath $stage | Write-Host }
              throw "Windows UI Automation failed: $($p.ExitCode)"
          }
          if (-not (Test-Path $screenshot)) { throw 'No actual WPF screenshot produced' }
          foreach ($name in @('TestCenter-01-Workspace.png','TestCenter-02-Geometry.png',
                             'TestCenter-03-Object.png','TestCenter-04-Dark.png',
                              'TestCenter-05-Graph.png','TestCenter-06-Runtime.png',
                              'TestCenter-07-Channel.png',
                              'TestCenter-08-RuntimeJournal.png',
                              'TestCenter-09-ManualRoot.png','TestCenter-10-ManualChannel.png',
                              'TestCenter-11-ArchitectureSmoke.png',
                              'TestCenter-12-ModuleConfig.png',
                              'TestCenter-Module-Connector.png',
                              'TestCenter-Module-Compute.png',
                              'TestCenter-Module-Simulation.png',
                              'TestCenter-Module-Service.png')) {
              if (-not (Test-Path (Join-Path (Split-Path $screenshot) $name))) {
                  throw "Missing real WPF screenshot: $name"
              }
          }
          Write-Host 'PASS UIAutomation Owner checks + four real MHS module saves/reopens + ArchitectureSmoke + 16 screenshots'
      - name: Upload actual TestCenter WPF screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestCenter-WPF-UIA
          path: |
            Output/Debug/x64/TestCenterUIA.png
            Output/Debug/x64/TestCenter-*.png
          if-no-files-found: ignore
      - name: NUnit Engine real assembly discovery and execution
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $output = Join-Path (Get-Location) 'Output/Debug/x64'
          foreach ($negative in @($false, $true)) {
              $name = if ($negative) { 'NUnitProbe.negative.xml' } else { 'NUnitProbe.positive.xml' }
              $report = Join-Path $output $name
              $args = @('--nunit-probe', ('"' + $report + '"'))
              if ($negative) { $args += '--negative' }
              $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList $args -PassThru
              try { Wait-Process -Id $p.Id -Timeout 90 -ErrorAction Stop }
              catch {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                  $traceFile = "$report.trace.txt"
                  if (Test-Path $traceFile) {
                      Get-Content -LiteralPath $traceFile | ForEach-Object { Write-Host "NUnit trace at timeout: $_" }
                  } else { Write-Host "NUnit trace file missing: $traceFile" }
                  throw "NUnit Engine PoC timed out after 90 seconds; negative=$negative"
              }
              $p.Refresh()
              $trace = "$report.trace.txt"
              if (Test-Path $trace) { Get-Content -LiteralPath $trace | ForEach-Object { Write-Host "NUnit trace: $_" } }
              if ($p.ExitCode -ne 0) {
                  $hostErrorFile = Join-Path ([System.IO.Path]::GetTempPath()) 'CxVisual-TestCenter-HostError.txt'
                  if (Test-Path $hostErrorFile) { Get-Content -LiteralPath $hostErrorFile | Write-Host }
                  throw "NUnit Engine PoC failed, negative=$negative, code=$($p.ExitCode)"
              }
              if (-not (Test-Path $report)) { throw "NUnit PoC report missing: $report" }
              [xml]$xml = Get-Content -LiteralPath $report -Raw
              $cases = @($xml.SelectNodes('//test-case'))
              $failures = @($cases | Where-Object { $_.GetAttribute('result') -eq 'Failed' }).Count
              $expected = if ($negative) { 1 } else { 0 }
              if ($cases.Count -ne 5 -or $failures -ne $expected) {
                  throw "NUnit Engine inaccurate case mapping: $name"
              }
              Write-Host "PASS NUnit Engine probe: $name; cases=$($cases.Count); failures=$failures"
          }
      - name: Verify NUnit external assembly and worker fingerprint
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $output = (Resolve-Path 'Output/Debug/x64').Path
          $external = Join-Path $output 'TCTExternalChecks.dll'
          $nunitDll = Join-Path $output 'nunit.framework.dll'
          if (-not (Test-Path $nunitDll)) { throw 'NUnit framework DLL missing from deployment' }
          @'
          using NUnit.Framework;
          namespace ExternalOwnerChecks {
            [TestFixture]
            public sealed class AdditionFixture {
              [TestCase(1,2)]
              [TestCase(3,4)]
              public void AddOne(int input, int expected) {
                Assert.That(input + 1, Is.EqualTo(expected));
              }
            }
          }
          '@ | Set-Content -LiteralPath (Join-Path $output 'TCTExternalChecks.generated.cs') -Encoding UTF8
          Add-Type -Path (Join-Path $output 'TCTExternalChecks.generated.cs') -ReferencedAssemblies $nunitDll -OutputAssembly $external
          $env:TCT_NUNIT_ASSEMBLIES = $external
          try {
              $report = Join-Path $output 'TestCenter.external.junit.xml'
              $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--filter','ExternalOwnerChecks.AdditionFixture','--report',('"' + $report + '"'),'--format','junit','--isolate') -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "External NUnit assembly failed with code $($p.ExitCode)" }
              [xml]$junit = Get-Content -LiteralPath $report -Raw
              if ([int]$junit.testsuite.tests -ne 2 -or
                  [int]$junit.testsuite.failures -ne 0 -or
                  [int]$junit.testsuite.errors -ne 0) {
                  throw 'Expected exactly two successful parameter rows from external assembly'
              }
              $cases = @($junit.testsuite.testcase)
              $ids = @($cases | ForEach-Object { $_.GetAttribute('name') } | Sort-Object -Unique)
              if ($ids.Count -ne 2 -or
                  @($ids | Where-Object { $_.StartsWith('NUNIT.TCTExternalChecks::') }).Count -ne 2) {
                  throw 'External NUnit IDs missing assembly namespace or parameter-row identity'
              }
              $wrongResult = Join-Path $output 'NUnitWorker.stale.xml'
              $attempt = [guid]::NewGuid().ToString('N')
              $runId = [guid]::NewGuid().ToString('N')
              $events = Join-Path $output 'NUnitWorker.stale.events'
              $q = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--worker', ('"' + $ids[0] + '"'), ('"' + $wrongResult + '"'), '1', $runId, $attempt, '0', ('"' + $events + '"'), ('"' + ('0'*64) + '"')) -Wait -PassThru
              if ($q.ExitCode -eq 0 -or (Test-Path $wrongResult)) {
                  throw 'NUnit Worker accepted a stale/bad parent fingerprint'
              }
              Write-Host 'PASS external DLL rows and Worker definition fingerprint fail-closed'
          } finally {
              Remove-Item Env:TCT_NUNIT_ASSEMBLIES -ErrorAction SilentlyContinue
          }
      - name: Verify structured Owner observation artifact replay
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $report = Join-Path (Get-Location) 'Output/Debug/x64/StructuredObservation.json'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id','TCT.M1.OBS.001','--report',('"' + $report + '"'),'--format','json','--isolate') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Real Owner structured observation case failed' }
          $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ([int]$data.total -ne 1 -or $data.cases[0].status -ne 'Passed') {
              throw 'Invalid structured test run summary'
          }
          $evidence = @($data.cases[0].artifacts | Where-Object {
              $_.mime -eq 'application/vnd.cxvisual.test-observation+xml'
          })
          if ($evidence.Count -ne 1) { throw 'Expected exactly one structured evidence artifact' }
          $root = Join-Path ([System.IO.Path]::GetTempPath()) ('CxVisual-TCT-Evidence/' + $data.runId)
          $artifact = Join-Path $root $evidence[0].relativePath
          if (-not (Test-Path $artifact)) { throw "Missing structured evidence $artifact" }
          if ((Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne
              [string]$evidence[0].sha256) {
              throw 'Structured observation SHA256 mismatch'
          }
          [xml]$observation = Get-Content -LiteralPath $artifact -Raw
          $record = $observation.Observation
          if ([string]$record.schema -ne '1' -or [string]$record.runId -ne [string]$data.runId -or
              [string]$record.attemptId -ne [string]$data.cases[0].attemptId -or
              [string]$record.sourceObjectId -ne 'FGERect2D') {
              throw 'Structured observation lost Run/Attempt/Owner identity'
          }
          Write-Host 'PASS versioned Geometry Owner observation and content addressed replay'
      - name: Verify timeout and abnormal Worker exit fail closed
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          foreach ($mode in @('hang','exit','tree')) {
              $env:TCT_M1_WORKER_FAULT = $mode
              $pidFile = Join-Path (Get-Location) 'Output/Debug/x64/WorkerFault.childpid.txt'
              if (Test-Path $pidFile) { Remove-Item -LiteralPath $pidFile -Force }
              $env:TCT_M1_WORKER_PIDFILE = $pidFile
              $report = Join-Path (Get-Location) ("Output/Debug/x64/WorkerFault." + $mode + ".json")
              try {
                  $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id','TCT.M1.WORKER.PROBE','--timeout-ms', $(if ($mode -eq 'tree') { '5000' } else { '450' }),'--report',('"' + $report + '"'),'--format','json','--isolate') -Wait -PassThru
              } finally {
                  Remove-Item Env:TCT_M1_WORKER_FAULT -ErrorAction SilentlyContinue
                  Remove-Item Env:TCT_M1_WORKER_PIDFILE -ErrorAction SilentlyContinue
              }
              if ($p.ExitCode -ne 1) { throw "Fault probe $mode did not fail closed; exit=$($p.ExitCode)" }
              $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              if ([int]$result.total -ne 1 -or
                  [string]$result.cases[0].status -ne $(if ($mode -ne 'exit') { 'TimedOut' } else { 'Error' })) {
                  throw "Worker $mode emitted wrong terminal state"
              }
              $partial = @($result.cases[0].artifacts | Where-Object {
                  $_.Mime -eq 'application/vnd.cxvisual.test-events-partial'
              })
              if ($partial.Count -ne 1 -or $partial[0].AttemptId -ne $result.cases[0].attemptId) {
                  throw "Worker $mode dropped abnormal-terminal event evidence"
              }
              if ($mode -eq 'tree') {
                  if (-not (Test-Path $pidFile)) { throw 'Worker failed to create nested child in time' }
                  $childId = [int](Get-Content -LiteralPath $pidFile -Raw)
                  Start-Sleep -Milliseconds 300
                  if (Get-Process -Id $childId -ErrorAction SilentlyContinue) {
                      & taskkill /PID $childId /T /F | Out-Null
                      throw "Orphan child process remains after timed-out Worker, PID=$childId"
                  }
              }
              Write-Host "PASS Worker fault mode $mode -> $($result.cases[0].status)"
          }
      - name: Run TestCenter in isolated workers
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $report = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter.junit.xml'
          $process = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--report',('"' + $report + '"'),'--format','junit','--isolate') -Wait -PassThru
          if (-not (Test-Path $report)) { throw 'TestCenter did not produce JUnit report' }
          [xml]$junit = Get-Content -LiteralPath $report -Raw
          Write-Host "TestCenter count: $($junit.testsuite.tests); failures: $($junit.testsuite.failures); errors: $($junit.testsuite.errors); skipped: $($junit.testsuite.skipped)"
          foreach ($case in @($junit.testsuite.testcase)) {
              $issue = $case.SelectSingleNode('error | failure | skipped')
              if ($null -ne $issue) {
                  Write-Host ("DIAGNOSTIC TestCenter case=" + $case.GetAttribute('name') +
                      "; type=" + $issue.Name + "; detail=" +
                      $issue.InnerText.Substring(0, [Math]::Min(1500, $issue.InnerText.Length)))
              }
          }
          if ($process.ExitCode -ne 0) { throw "TestCenter failed with exit code $($process.ExitCode)" }
          if ([int]$junit.testsuite.tests -lt 1 -or [int]$junit.testsuite.failures -ne 0 -or
              [int]$junit.testsuite.errors -ne 0 -or [int]$junit.testsuite.skipped -ne 0) {
              throw 'Isolation JUnit includes no tests or non-passing tests'
          }
          if (@($junit.testsuite.testcase).Count -ne [int]$junit.testsuite.tests) {
              throw 'JUnit test count differs from actual testcase count'
          }
          $nunitCases = @($junit.testsuite.testcase | Where-Object {
              $_.GetAttribute('name').StartsWith('NUNIT.')
          })
          if ($nunitCases.Count -ne 8) {
              throw "Unified TestCenter Catalog must contain 8 NUnit cases including new sources; got $($nunitCases.Count)"
          }
          if (@($junit.testsuite.testcase | Where-Object {
              $_.GetAttribute('name') -eq 'TCT.AUTO.001'
          }).Count -ne 1) { throw 'New source not discovered without csproj edits' }
          Write-Host 'PASS: new source compiled and discovered automatically'
          Write-Host 'PASS: NUnit cases run through unified TCT Worker and JUnit'
      - name: Verify native NUnit failure propagates through TCT Worker
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $report = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter.nunit-failure.junit.xml'
          $testId = 'NUNIT.CxVisual.TestCenter.NUnitIntegration.TCTNUnitProbeFixture.NegativeControl'
          $env:TCT_NUNIT_EXPECT_NEGATIVE = '1'
          try {
              $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id',('"' + $testId + '"'),'--report',('"' + $report + '"'),'--format','junit','--isolate') -Wait -PassThru
          } finally { Remove-Item Env:TCT_NUNIT_EXPECT_NEGATIVE -ErrorAction SilentlyContinue }
          if ($p.ExitCode -ne 1) { throw "NUnit negative case should produce TCT failure exit 1; got $($p.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'NUnit/TCT negative evidence missing' }
          [xml]$junit = Get-Content -LiteralPath $report -Raw
          if ([int]$junit.testsuite.tests -ne 1 -or [int]$junit.testsuite.failures -ne 1) {
              throw 'NUnit failure did not map to exactly one TCT failed case'
          }
          if (-not ((Get-Content -LiteralPath $report -Raw).Contains('TCT_NUNIT_NEGATIVE_CONTROL'))) {
              throw 'Original NUnit failure message lost in TCT result'
          }
          Write-Host 'PASS: intentional native NUnit assertion failure remains Failed in TCT JUnit'
      - name: Verify NUnit skipped, inconclusive and error status mapping
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $testId = 'NUNIT.CxVisual.TestCenter.NUnitIntegration.TCTNUnitProbeFixture.NegativeControl'
          foreach ($scenario in @('ignored','inconclusive','error')) {
              $report = Join-Path (Get-Location) ("Output/Debug/x64/NUnitState." + $scenario + ".xml")
              $env:TCT_NUNIT_EXPECT_NEGATIVE = $scenario
              try {
                  $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id',('"' + $testId + '"'),'--report',('"' + $report + '"'),'--format','junit','--isolate') -Wait -PassThru
              } finally { Remove-Item Env:TCT_NUNIT_EXPECT_NEGATIVE -ErrorAction SilentlyContinue }
              if ($p.ExitCode -ne 1) { throw "NUnit $scenario exit=$($p.ExitCode), expected 1" }
              [xml]$xml = Get-Content -LiteralPath $report -Raw
              $case = @($xml.testsuite.testcase)[0]
              if ([int]$xml.testsuite.tests -ne 1) { throw "Incorrect $scenario test count" }
              if ($scenario -eq 'error') {
                  if ([int]$xml.testsuite.errors -ne 1) { throw "NUnit error wrongly classified" }
              } elseif ([int]$xml.testsuite.skipped -ne 1) {
                  throw "NUnit $scenario must not appear passed"
              }
              Write-Host "PASS native NUnit state $scenario => TCT nonpassing"
          }
      - name: Verify Worker event Artifact roundtrip
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $report = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter.events.json'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id','TCT.DEV.002','--report',('"' + $report + '"'),'--format','json','--isolate') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Event artifact test failed code=$($p.ExitCode)" }
          $data = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ([int]$data.total -ne 1 -or $data.cases[0].status -ne 'Passed') { throw 'Unexpected event case status' }
          $events = @($data.cases[0].artifacts | Where-Object {
              $_.mime -eq 'application/vnd.cxvisual.test-events'
          })
          if ($events.Count -ne 1 -or $events[0].attemptId -ne $data.cases[0].attemptId) {
              throw 'Cross-process event artifact missing/cross-attempt'
          }
          $artifact = Join-Path ([System.IO.Path]::GetTempPath()) ('CxVisual-TCT-Evidence/' + $data.runId + '/' + $events[0].RelativePath)
          if (-not (Test-Path $artifact)) {
              $artifact = Join-Path ([System.IO.Path]::GetTempPath()) ('CxVisual-TCT-Evidence/' + $data.runId + '/' + $events[0].relativePath)
          }
          if (-not (Test-Path $artifact)) { throw 'Event artifact cannot be reopened' }
          $sha = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne [string]$events[0].sha256) { throw 'Event artifact content hash mismatch' }
          $lines = @(Get-Content -LiteralPath $artifact)
          if ($lines.Count -lt 3) { throw "Only $($lines.Count) persisted events" }
          $index = 0
          foreach ($line in $lines) {
              $index++
              if (-not $line.StartsWith(($index.ToString() + '|'))) { throw 'Broken event sequence' }
          }
          Write-Host "PASS Worker event artifact $($lines.Count) events; SHA256 verified"
      - name: Verify historical Owner replay in a fresh process after temp removal
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $history = Join-Path (Get-Location) 'Output/Debug/x64/M1EvidenceHistory'
          $source = Join-Path (Get-Location) 'Output/Debug/x64/M1Evidence.source.json'
          $replayed = Join-Path (Get-Location) 'Output/Debug/x64/M1Evidence.replayed.json'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--id','TCT.M1.OBS.004','--history-dir',('"' + $history + '"'),'--report',('"' + $source + '"'),'--format','json','--isolate') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Real MDS Owner archived run failed' }
          $summary = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $live = Join-Path ([System.IO.Path]::GetTempPath()) ('CxVisual-TCT-Evidence/' + $summary.runId)
          if (Test-Path $live) { Remove-Item -LiteralPath $live -Recurse -Force }
          $q = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--replay-history',('"' + $history + '"'),$summary.runId,('"' + $replayed + '"')) -Wait -PassThru
          if ($q.ExitCode -ne 0) { throw "Cold-process archived replay failed: $($q.ExitCode)" }
          $historyResult = Get-Content -LiteralPath $replayed -Raw | ConvertFrom-Json
          if ($historyResult.runId -ne $summary.runId -or [int]$historyResult.count -ne 1 -or
              -not $historyResult.originalPassed -or
              @($historyResult.observations).Count -ne 1 -or
              $historyResult.observations[0].sourceObjectId -ne 'MDSDataStack') {
              throw 'Historical replay lost actual Run/Attempt/MDS Owner evidence'
          }
          Write-Host 'PASS cold-process replay of real MDS Owner after deleting live evidence root'
      - name: Parallel repeat and history regression
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $out = Join-Path (Get-Location) 'Output/Debug/x64'
          $report = Join-Path $out 'TestCenter.parallel.junit.xml'
          $history = Join-Path $out 'TestCenterHistory'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--profile','Regression','--parallel','3','--repeat','3','--report',('"' + $report + '"'),'--format','junit','--isolate','--history-dir',('"' + $history + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Parallel TestCenter returned $($p.ExitCode)" }
          if (-not (Test-Path $report)) { throw "Parallel report missing" }
          [xml]$junit = Get-Content -LiteralPath $report -Raw
          [xml]$baseline = Get-Content -LiteralPath (Join-Path $out 'TestCenter.junit.xml') -Raw
          $expected = [int]$baseline.testsuite.tests * 3
          if ([int]$junit.testsuite.tests -ne $expected -or [int]$junit.testsuite.failures -ne 0 -or
              [int]$junit.testsuite.errors -ne 0 -or [int]$junit.testsuite.skipped -ne 0) {
              throw "Parallel expected $expected successful attempts; received $($junit.testsuite.tests)"
          }
          $cases = @($junit.testsuite.testcase)
          if ($cases.Count -ne $expected) { throw 'JUnit attempt nodes are missing' }
          $attemptIds = @($cases | ForEach-Object { [string]$_.GetAttribute('attemptId') })
          if (@($attemptIds | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
              throw 'An attempt has an empty AttemptId'
          }
          if (@($attemptIds | Select-Object -Unique).Count -ne $expected) {
              throw 'AttemptIds collide across repeated or concurrent tests'
          }
          $runId = [string]$junit.testsuite.runId
          if ([string]::IsNullOrWhiteSpace($runId)) { throw 'RunId not recorded in JUnit suite' }
          $names = @($baseline.testsuite.testcase | ForEach-Object { [string]$_.GetAttribute('name') } |
              Sort-Object -Unique)
          foreach ($name in $names) {
              $observed = @($cases | Where-Object { [string]$_.GetAttribute('name') -eq $name })
              if ($observed.Count -ne 3 -or
                  @($observed | ForEach-Object { [string]$_.GetAttribute('iteration') } | Sort-Object -Unique).Count -ne 3) {
                  throw "Test $name is not repeated exactly three times"
              }
          }
          $historyFiles = @(Get-ChildItem -LiteralPath $history -Recurse -Filter 'summary.json')
          if ($historyFiles.Count -ne 1) { throw "History was not archived exactly once" }
          Write-Host "PASS parallel attempts: $($junit.testsuite.tests), history JSON: $($historyFiles[0].FullName)"
      - name: Verify empty selection fails closed
        shell: powershell
        run: |
          $exe = (Resolve-Path 'Output/Debug/x64/CxVisual.TestCenter.exe').Path
          $report = Join-Path (Get-Location) 'Output/Debug/x64/TestCenter.empty.junit.xml'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--run','--filter','__TCT_NONEXISTENT_CASE__','--report',('"' + $report + '"'),'--format','junit','--isolate') -Wait -PassThru
          if ($p.ExitCode -ne 1) { throw "Empty selection returned $($p.ExitCode), expected failure code 1" }
          if (-not (Test-Path $report)) { throw 'Empty selection did not produce evidence' }
          [xml]$junit = Get-Content -LiteralPath $report -Raw
          if ([int]$junit.testsuite.tests -ne 0) { throw 'Empty selection was not actually empty' }
          Write-Host 'PASS: empty selection fails closed and remains inspectable'
      - name: Save Build and TestCenter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxvisual-testcenter-evidence
          path: |
            Output/Debug/x64/Build.log
            Output/Debug/x64/DependencyAudit.csv
            Output/Debug/x64/NUnitProbe.*.trace.txt
            Output/Debug/x64/NUnitProbe.positive.xml
            Output/Debug/x64/NUnitProbe.negative.xml
            Output/Debug/x64/WorkerFault.*.json
            Output/Debug/x64/TestCenter.catalog.json
            Output/Debug/x64/M1NUnitAuthor.junit.xml
            Output/Debug/x64/M1Evidence.*.json
            Output/Debug/x64/M1EvidenceHistory/**
            Output/Debug/x64/StructuredObservation.json
            Output/Debug/x64/TestCenter.external.junit.xml
            Output/Debug/x64/TestCenter.events.json
            Output/Debug/x64/TestCenter.junit.xml
            Output/Debug/x64/TestCenter.parallel.junit.xml
            Output/Debug/x64/TestCenter.nunit-failure.junit.xml
            Output/Debug/x64/NUnitState.*.xml
            Output/Debug/x64/TestCenter.empty.junit.xml
            Output/Debug/x64/TestCenterHistory/**/summary.json
          if-no-files-found: warn
