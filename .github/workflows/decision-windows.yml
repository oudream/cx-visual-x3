name: CxVisual Decision Windows .NET48 Acceptance

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Mechanism/Decision/**'
      - 'Mechanism/Runtime/Execution/DecisionBinding/**'
      - 'Mechanism/Core/**'
      - 'Mechanism/Runtime/**'
      - 'Tests/ArchitectureSmoke/**'
      - 'DOCS/Architecture/CxVisual_统一决策与规划体系*'
      - 'DOCS/Implementation/CxVisual_Decision_*'
      - '.github/workflows/decision-windows.yml'

jobs:
  decision-contract:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Verify Decision project and static sources are Runtime-free
        shell: pwsh
        run: |
          $project = Get-Content 'Mechanism/Decision/CxVisual.Mechanism.Decision.csproj' -Raw
          if ($project -match 'Mechanism\\Runtime' -or $project -match 'CxVisual.Mechanism.Runtime.csproj') {
            throw 'Decision may not ProjectReference Runtime'
          }
          $files = @(Get-ChildItem 'Mechanism/Decision' -Filter '*.cs' -File)
          if ($files.Count -lt 12) { throw 'Static Decision source file set unexpectedly small' }
          foreach ($file in $files) {
            $source = Get-Content -LiteralPath $file.FullName
            $code = ($source | Where-Object { $_ -notmatch '^\\s*(//|\\*|/\\*)' }) -join "`n"
            if ($code -match '(?m)^\\s*using\\s+CxVisual\\.Mechanism\\.Runtime\\.' -or
                $code -match '\\b(IMRKCapabilityResolver|MRKResolvedCapability|MRKExecutionPlan|MRKFlowHandle|MRKExecutionEngine)\\b') {
              throw "Runtime API leaked into Decision source: $($file.Name)"
            }
          }
          foreach ($file in @('MOCEngineeringCompiler.cs','MOCBuildService.cs',
              'MOCProjectRelease.cs','MOCManifestRuntimeBinding.cs',
              'MOCBindingContractInspector.cs','MOCCapabilityCatalogRuntimeFactory.cs')) {
            if (-not (Test-Path "Mechanism/Runtime/Execution/DecisionBinding/$file")) {
              throw "Missing Runtime binder: $file"
            }
          }
          if (-not (Test-Path 'Mechanism/Decision/MOCFlowBuilder.cs')) {
            throw 'Missing static MOCFlowBuilder'
          }
      - name: Build unified .NET Framework 4.8 x64 solution
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\CxVisual.Unified.sln /t:Restore,Build /m:1 /nr:false /p:Configuration=Release /p:Platform=x64 /p:UseSharedCompilation=false /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Decision unified Windows build failed' }
      - name: Decision offline discovery and hard-constraint smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe).Path
          & $exe --decision
          if ($LASTEXITCODE -ne 0) { throw 'Decision focused smoke failed' }
      - name: ArchitectureSmoke full regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe).Path
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'ArchitectureSmoke default regression failed' }
