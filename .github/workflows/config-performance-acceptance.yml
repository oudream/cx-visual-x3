name: CxVisual Config D Windows Scale Acceptance
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/config-performance-acceptance.yml'
      - 'Tests/ArchitectureSmoke/ConfigPerformanceTests.cs'
  workflow_dispatch:

jobs:
  config-d-scale:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Rebuild .NET Framework 4.8 configuration foundation smoke
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\Tests\ConfigFoundationSmoke\CxVisual.Tests.ConfigFoundationSmoke.csproj /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "配置底座压力验收编译失败" }
      - name: Run 10000 items 1000 subscribers 1000 revisions and latency samples
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "CxConfigD-Full-Metrics.txt"
          & .\Output\Release\x64\CxVisual.Tests.ConfigFoundationSmoke.exe --config-performance-full *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "CONFIG_D full acceptance failed; inspect artifact log" }
      - name: Preserve measured report and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxvisual-config-d-metrics
          path: ${{ runner.temp }}/CxConfigD-Full-Metrics.txt
          if-no-files-found: warn
          retention-days: 30
