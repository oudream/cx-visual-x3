name: 配置公共底座独立编译与验收

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  configuration-foundation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: 仅编译基础和机制两个配置项目及独立测试
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\Tests\ConfigFoundationSmoke\CxVisual.Tests.ConfigFoundationSmoke.csproj /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "两个配置项目编译失败" }
      - name: 阶段D轻量并发与性能基线（不作为SLA阈值）
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ConfigFoundationSmoke.exe --config-performance-smoke
          if ($LASTEXITCODE -ne 0) { throw "配置 D 性能与数据正确性基线失败" }
      - name: 阶段D完整规模压力（仅手工触发）
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        timeout-minutes: 40
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ConfigFoundationSmoke.exe --config-performance-full
          if ($LASTEXITCODE -ne 0) { throw "配置 D 完整规模压力验收失败" }
      - name: 执行基础配置场景和完整回归
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ConfigFoundationSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "配置核心回归测试失败" }
