name: CxVisual Unified Runtime Windows TDD
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Foundation/Infrastructure/Concurrency/**'
      - 'Foundation/Data/Execution/**'
      - 'Mechanism/Runtime/Execution/**'
      - 'Mechanism/Data/Execution/**'
      - 'Applications/Runtime.Host/**'
      - 'Tests/ArchitectureSmoke/**'
      - 'DOCS/Testing/UnifiedExecution_TDD_Matrix_V0.1.md'
      - 'DOCS/Architecture/CxVisual_统一运行体系_开发者简洁入口与编排共源_V0.1.md'
      - 'DOCS/Testing/CxVisual_统一运行体系内核_实现与验收_V0.3.md'
      - '.github/workflows/unified-runtime-windows.yml'
jobs:
  runtime-end-to-end:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore real .NET Framework 4.8 test packages
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\Tests\TestCenter\CxVisual.TestCenter.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "TestCenter NUnit package restore failed" }
      - name: Rebuild entire solution on Windows x64
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\Applications\Studio\CxVisual.Studio.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Studio AvalonDock NuGet Restore failed" }
          & $msbuild .\CxVisual.Unified.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Full Windows .NET48 rebuild failed" }
      - name: B1-B4 real engineering and Vision MDS vertical gate
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --orchestration-vertical
          if ($LASTEXITCODE -ne 0) { throw "Real orchestration vertical gate failed" }
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --orchestration-industrial
          if ($LASTEXITCODE -ne 0) { throw "Orchestration industrial cancellation/resource gate failed" }
      - name: Execute real concurrency and orchestration tests
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --concurrency
          if ($LASTEXITCODE -ne 0) { throw "F19 concurrency tests failed" }
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --command-center
          if ($LASTEXITCODE -ne 0) { throw 'CommandCenter P0 tests failed' }
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Unified Execution architecture tests failed" }
      - name: B6 sustained MDS memory ownership and release soak
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --runtime-data-soak 20000
          if ($LASTEXITCODE -ne 0) { throw 'B6 MDS 20k-frame lifecycle leak/latency soak failed' }
      - name: Execute compiled subflow, authorized publication and durable host recovery
        shell: pwsh
        run: |
          $journal = Join-Path $env:RUNNER_TEMP ("CxRuntime-TDD-" + [guid]::NewGuid().ToString("N") + ".journal")
          $exe = '.\Output\Release\x64\CxVisual.Runtime.Host.exe'
          & $exe runtime-run $journal
          if ($LASTEXITCODE -ne 0) { throw "Runtime first execution failed" }
          & $exe runtime-recover $journal
          if ($LASTEXITCODE -ne 0) { throw "Runtime Journal recovery scan failed" }
          & $exe runtime-run $journal
          if ($LASTEXITCODE -ne 0) { throw "Runtime safe restart failed" }
          $out = @('run','status','stop') | & $exe runtime-serve $journal
          $message = $out -join '|'
          if ($LASTEXITCODE -ne 0 -or $message -notmatch 'Accepted Flow=' -or
              $message -notmatch 'Host=Ready' -or $message -notmatch 'RuntimeHost stopped cleanly') {
              throw "Runtime interactive run, observe and stop failed: $message"
          }
          & $exe runtime-recover $journal
          if ($LASTEXITCODE -ne 0) { throw "Runtime safe post-stop recovery scan failed" }
          Write-Host "PASS Runtime: compile, publish, flow, journal, restart, observe and drain"
      - name: B6 Host recovery negative path and repeat process restart
        shell: pwsh
        run: |
          $exe = '.\Output\Release\x64\CxVisual.Runtime.Host.exe'
          $missing = Join-Path $env:RUNNER_TEMP ("CxMissing-" + [guid]::NewGuid().ToString("N") + ".journal")
          & $exe runtime-recover $missing
          if ($LASTEXITCODE -ne 2 -or (Test-Path $missing)) {
            throw 'Missing journal recovery unexpectedly succeeded or created state'
          }
          $journal = Join-Path $env:RUNNER_TEMP ("CxHostRepeat-" + [guid]::NewGuid().ToString("N") + ".journal")
          for ($i = 0; $i -lt 5; $i++) {
            & $exe runtime-run $journal
            if ($LASTEXITCODE -ne 0) { throw "Host repeat-run failed at iteration $i" }
            & $exe runtime-recover $journal
            if ($LASTEXITCODE -ne 0) { throw "Host recovery failed at iteration $i" }
          }
          Write-Host 'PASS B6: missing journal rejects safely, five isolated Host process restarts and recovery scans'
      - name: Verify Host trusted release ledger across process restarts and torn writes
        shell: pwsh
        run: |
          $exe = '.\Output\Release\x64\CxVisual.Runtime.Host.exe'
          $ledger = Join-Path $env:RUNNER_TEMP ("CxDecisionRelease-" + [guid]::NewGuid().ToString("N") + ".ledger")
          & $exe release-ledger-smoke $ledger
          if ($LASTEXITCODE -ne 0) { throw 'Host release ledger first commission failed' }
          & $exe release-ledger-resume $ledger
          if ($LASTEXITCODE -ne 0) { throw 'Host release ledger cross-process antirollback failed' }
          [System.IO.File]::AppendAllText($ledger, 'X')
          & $exe release-ledger-corrupt-check $ledger
          if ($LASTEXITCODE -ne 0) { throw 'Host release ledger accepted torn journal' }
          Write-Host 'PASS Host signed release: exclusive append journal, antirollback after restart, torn record fail-closed'
      - name: Verify pinned Host certificate and real signed Plan publication
        shell: pwsh
        run: |
          $exe = '.\\Output\\Release\\x64\\CxVisual.Runtime.Host.exe'
          $root = Join-Path $env:RUNNER_TEMP ("CxTrustedRelease-" + [guid]::NewGuid().ToString("N"))
          & $exe release-trusted-smoke $root
          if ($LASTEXITCODE -ne 0) { throw 'Host pinned signing identity, real Plan Stage/Activate or durable ledger verification failed' }
          Write-Host 'PASS Host: signed Plan verified using pinned public certificate; MRK Stage and safe Activate; corrupted key/replay denied'
