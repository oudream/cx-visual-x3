name: CxVisual FIM MVI Imaging Windows Acceptance
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Foundation/Imaging/**'
      - 'Foundation/Volume/**'
      - 'Professional/CT3D/**'
      - 'Tests/ArchitectureSmoke/Integration/FVOVolumeTests.cs'
      - 'Foundation/Geometry/**'
      - 'Mechanism/Visual/Imaging/**'
      - 'Mechanism/Visual/Volume/**'
      - 'Mechanism/Visual/CxVisual.Mechanism.Visual.csproj'
      - 'Tests/ArchitectureSmoke/Integration/FIMImagingTests.cs'
      - 'Tests/ArchitectureSmoke/Integration/MVIImageSessionTests.cs'
      - 'Tests/ArchitectureSmoke/Program.cs'
      - 'Mechanism/Presentation.Wpf/Imaging/**'
      - 'Mechanism/Presentation.Wpf/Volume/**'
      - 'Tests/TestCenter/Manual/Volume/**'
      - 'Mechanism/Presentation.Wpf/CxVisual.Mechanism.Presentation.Wpf.csproj'
      - 'Tests/TestCenter/Manual/Imaging/**'
      - 'Tests/TestCenter/Common/Framework/TCTWorkspaceRegistry.cs'
      - 'Tests/TestCenter/App.xaml.cs'
      - 'Tests/TestCenter/CxVisual.TestCenter.csproj'
      - '.github/workflows/imaging-foundation-windows.yml'
jobs:
  imaging-foundation:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore package references
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\Tests\TestCenter\CxVisual.TestCenter.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'TestCenter dependency restore failed' }
          & $msbuild .\Applications\Studio\CxVisual.Studio.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Studio dependency restore failed' }
      - name: Build all existing projects on Windows x64
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\CxVisual.Unified.sln /t:Restore,Build /m:1 /nr:false /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Windows .NET Framework 4.8 x64 build failed' }
      - name: Verify structure and dependency DAG
        shell: pwsh
        run: |
          & .\Build\Verify-Structure.ps1
          if (-not $?) { throw 'Structure verification failed' }
          & .\Build\Verify-OwnerDependencies.ps1
          if (-not $?) { throw 'Owner dependency verification failed' }
      - name: Execute FIM MVI standalone and default smoke
        shell: pwsh
        run: |
          $exe = '.\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe'
          & $exe --volume
          if ($LASTEXITCODE -ne 0) { throw 'FVO --volume regression failed' }
          & $exe --imaging
          if ($LASTEXITCODE -ne 0) { throw 'FIM/MVI --imaging regression failed' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Default architecture regression failed' }
      - name: Execute real WPF ImageViewer headless window and PNG roundtrip
        shell: pwsh
        run: |
          $exe = '.\Output\Release\x64\CxVisual.TestCenter.exe'
          # TestCenter is WinExe: PowerShell's '&' is nonblocking and $LASTEXITCODE may be null.
          $env:CXVISUAL_IMAGING_UI_SCREENSHOT = Join-Path (Get-Location) 'Output\Imaging-UI\workbench.png'
          $process = Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList '--imaging-viewer-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path ([System.IO.Path]::GetTempPath()) 'CxVisual-Imaging-Viewer-Error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw 'TestCenter native WPF ImageViewer smoke failed'
          }
      - name: Execute real WPF 3D spatial slice workbench
        shell: pwsh
        run: |
          $exe = '.\\Output\\Release\\x64\\CxVisual.TestCenter.exe'
          $env:CXVISUAL_VOLUME_UI_SCREENSHOT = Join-Path (Get-Location) 'Output\\Volume-UI\\workbench.png'
          $process = Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList '--volume-viewer-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path ([System.IO.Path]::GetTempPath()) 'CxVisual-Volume-Viewer-Error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw 'Native WPF 3D slice workbench smoke failed'
          }
      - name: Upload WPF 3D slice workbench screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxvisual-volume-ui-\u0024{{ github.sha }}
          path: Output/Volume-UI/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Upload original WPF workbench screenshot (synthetic fixture)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxvisual-imaging-ui-${{ github.sha }}
          path: Output/Imaging-UI/*.png
          retention-days: 7
          if-no-files-found: warn
