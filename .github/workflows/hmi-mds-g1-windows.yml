name: CxVisual HMI MDS G1 Windows
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Professional/HMI/**'
      - 'Mechanism/Presentation.Wpf/Visual/MPWLiveSceneControl.cs'
      - 'Applications/Studio/StudioShell.Hmi.cs'
      - 'Applications/Studio/StudioShell.Hmi.Remote.cs'
      - 'Applications/Studio/StudioShell.ResourceDocuments.cs'
      - 'Tests/ArchitectureSmoke/Integration/HmiScadaPipeTests.cs'
      - 'Applications/Studio/StudioShell.ResourceTree.cs'
      - 'Applications/Studio/StudioShell.ResourceEditors.cs'
      - 'Applications/Studio/StudioShellSelfTests.cs'
      - 'Applications/Studio/StudioViewModel.Engineering.cs'
      - 'Applications/Studio/App.xaml.cs'
      - 'Applications/Studio/MainWindow.xaml'
      - 'Mechanism/Visual/MVISceneProjection.cs'
      - 'Applications/Studio/CxVisual.Studio.csproj'
      - 'Applications/Studio/StudioShell.cs'
      - 'Applications/Studio/StudioShell.Variables.cs'
      - 'Tests/ArchitectureSmoke/Integration/HmiRuntimeTests.cs'
      - 'Tests/ArchitectureSmoke/Integration/HmiWpfTests.cs'
      - 'Tests/ArchitectureSmoke/Program.cs'
      - 'Tests/ArchitectureSmoke/CxVisual.Tests.ArchitectureSmoke.csproj'
      - '.github/workflows/hmi-mds-g1-windows.yml'
concurrency:
  group: cxvisual-hmi-g1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hmi-mds-g1:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore project dependencies
        shell: pwsh
        run: |
          & msbuild.exe Tests/ArchitectureSmoke/CxVisual.Tests.ArchitectureSmoke.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0) { throw 'HMI restore failed' }
      - name: Build HMI and ArchitectureSmoke .NET Framework 4.8 x64
        shell: pwsh
        run: |
          & msbuild.exe Tests/ArchitectureSmoke/CxVisual.Tests.ArchitectureSmoke.csproj /m:1 /nr:false /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0) { throw 'HMI build failed' }
      - name: Restore and build real Studio HMI dock host
        shell: pwsh
        run: |
          & msbuild.exe Applications/Studio/CxVisual.Studio.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0) { throw 'HMI Studio restore failed' }
          & msbuild.exe Applications/Studio/CxVisual.Studio.csproj /m:1 /nr:false /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0) { throw 'HMI Studio build failed' }
      - name: Run real MDS value and quality regression
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --hmi
          if($LASTEXITCODE -ne 0) { throw 'HMI G1 failed' }
      - name: Run actual NamedPipe v1 HMI consumer and generation gates
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --hmi-pipe
          if($LASTEXITCODE -ne 0) { throw 'HMI Remote Pipe v1 contract failed' }
      - name: Run WPF STA real Page and MDS update
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --hmi-wpf
          if($LASTEXITCODE -ne 0) { throw 'HMI WPF STA G1 failed' }
      - name: Real Studio WPF STA HMI engineering user path
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'Output/Release/x64/CxVisual.Studio.exe').Path
          $process = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -ArgumentList @('--hmi-studio-smoke') -PassThru
          try { Wait-Process -Id $process.Id -Timeout 120 -ErrorAction Stop }
          catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Studio HMI STA execution timed out'
          }
          $process.Refresh()
          $report = 'Output/Release/x64/StudioShellSelfTest.txt'
          if(Test-Path $report) { Get-Content $report | Write-Host }
          if($process.ExitCode -ne 0) { throw "Studio HMI STA exit code $($process.ExitCode)" }
          if(-not (Test-Path $report) -or
             -not (Select-String -Path $report -Pattern 'PASS HMI Studio WPF STA' -Quiet)) {
            throw 'Studio HMI WPF evidence missing'
          }
      - name: Report verification boundary
        shell: pwsh
        run: |
          Write-Host 'Only in-process MDS/Visual compatibility and fail-closed HMI contract are tested.'
          Write-Host 'No authenticated remote IPC, physical PLC, G2 or HIL is claimed.'
