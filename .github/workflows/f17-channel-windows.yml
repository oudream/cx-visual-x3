name: CxVisual F17 Channel Windows Acceptance
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Foundation/Transport/**'
      - 'Foundation/Data/Configuration/**'
      - 'Mechanism/Connectivity/**'
      - 'Tests/ArchitectureSmoke/Integration/ModuleChannelTransportSmokeTests.cs'
      - 'Tests/ArchitectureSmoke/Transport/**'
      - 'Tests/ArchitectureSmoke/Program.cs'
      - 'Tests/ArchitectureSmoke/CxVisual.Tests.ArchitectureSmoke.csproj'
      - 'Mechanism/Data/CxVisual.Mechanism.Data.csproj'
      - 'Tests/TestCenter/Manual/Channel/**'
      - 'Mechanism/Presentation.Wpf/MPWConfigEditorDialogV14.cs'
      - '.github/workflows/f17-channel-windows.yml'
jobs:
  f17-channel-acceptance:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore application and test dependencies
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\Tests\TestCenter\CxVisual.TestCenter.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "TestCenter packages restore failed" }
          & $msbuild .\Applications\Studio\CxVisual.Studio.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Studio packages restore failed" }
      - name: Build .NET Framework 4.8 x64 solution and FTR integration
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\CxVisual.Unified.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Channel integrated solution build failed" }
      - name: Run dedicated FTR Connector and OS loopback acceptance
        shell: pwsh
        run: |
          $output = & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --channel-transport 2>&1
          $status = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($status -ne 0) { throw "F17 Channel execution failed: $status" }
          $joined = $output -join "`n"
          if ($joined -notmatch 'CHANNEL.CONNECTOR: 15 built-in FTR kinds' -or
              $joined -notmatch 'CHANNEL.TRANSPORT: TCP/UDP loopback' -or
              $joined -notmatch 'F17.PIPE_BULK PASS' -or $joined -notmatch 'F17.PIPE_ADMISSION PASS' -or
              $joined -notmatch 'F17.NOTIFICATION PASS') {
              throw "F17 Channel expected acceptance evidence not present"
          }
      - name: Run TCP and cross-process NamedPipe 2GiB-per-direction integrity and resource measurements
        shell: pwsh
        timeout-minutes: 7
        run: |
          New-Item -ItemType Directory -Force Output/Release/x64 | Out-Null
          $output = & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --channel-bulk-long 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath Output/Release/x64/F17-Bulk-Volume.log | Write-Host
          if ($status -ne 0 -or ($output -join "`n") -notmatch 'F17.BULK_VOLUME_PASS bytesEachDirection=2147483648' -or
              ($output -join "`n") -notmatch 'F17.PIPE_VOLUME_PASS bytesEachDirection=2147483648 crossProcess=true') {
              throw "F17 CT volume stream verification failed: $status"
          }
      - name: Verify Foundation Transport unique Owner
        shell: pwsh
        run: |
          $files = @(Get-ChildItem Foundation/Transport/Channels -Recurse -Filter '*.cs' -File)
          $legacy = @(Get-ChildItem Mechanism/Connectivity/Channels -Recurse -Filter '*.cs' -File -ErrorAction SilentlyContinue)
          [xml]$project = Get-Content Foundation/Transport/CxVisual.Foundation.Transport.csproj -Raw
          $compiled = @($project.SelectNodes("//*[local-name()='Compile']/@Include") |
              ForEach-Object { (Resolve-Path (Join-Path 'Foundation/Transport' $_.Value)).Path })
          foreach ($file in $files) {
              if (@($compiled | Where-Object { $_ -eq $file.FullName }).Count -ne 1) {
                  throw "FTR source missing or duplicated in Compile items: $($file.FullName)"
              }
              if ($file.BaseName -notmatch '^I?FTR') { throw "Invalid FTR source identity: $($file.Name)" }
          }
          if ($files.Count -lt 56) { throw "Existing FTR sources removed: $($files.Count)" }
          if ($legacy.Count -gt 0) { throw "Legacy compiled Channel source remains in Mechanism" }
          Write-Host "PASS F17 unique owner: $($files.Count) individually compiled Channel files; no old Mechanism Channel sources"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F17-volume-stream-measurements
          path: Output/Release/x64/F17-Bulk-Volume.log
          if-no-files-found: ignore
