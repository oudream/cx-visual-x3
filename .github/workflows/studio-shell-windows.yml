name: CxVisual Studio S1 Windows Shell Acceptance
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Applications/Studio/**'
      - 'Mechanism/Presentation.Wpf/**'
      # P0联动门禁：底层Owner源码改变时也需重验Studio实际WPF操作。
      - 'Mechanism/Core/**'
      - 'Mechanism/Visual/**'
      - 'Mechanism/Decision/**'
      - 'Mechanism/Data/**'
      - 'Mechanism/Runtime/**'
      - 'Mechanism/Lifecycle/**'
      - 'Foundation/**'
      - 'Professional/**'
      - 'Hello/AvalonDock/**'
      - '.github/workflows/studio-shell-windows.yml'
jobs:
  studio-shell:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build existing unified solution with AvalonDock 5.0.1
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\CxVisual.Unified.sln /t:Restore,Build /m:1 /nr:false /p:Configuration=Release /p:Platform=x64 /p:UseSharedCompilation=false /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Studio S1 unified solution build failed" }
      - name: Run real WPF STA S1 shell tests
        shell: pwsh
        run: |
          $exe = Resolve-Path .\Output\Release\x64\CxVisual.Studio.exe
          $report = Join-Path (Split-Path $exe) 'StudioShellSelfTest.txt'
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--shell-self-test' -PassThru
          if (-not $p.WaitForExit(120000)) {
            try { $p.Kill() } catch { }
            throw 'Studio STA self-test did not exit within 120 seconds'
          }
          if (Test-Path $report) { Get-Content $report }
          else { Write-Host "GUI process exited without a self-test report." }
          if ($p.ExitCode -ne 0) { throw "Studio Shell self tests exited $($p.ExitCode)" }
          if (-not (Test-Path $report)) { throw "Missing StudioShellSelfTest.txt" }
          $passed = @(Select-String -Path $report -Pattern '^PASS:')
          $failed = @(Select-String -Path $report -Pattern '^FAIL:')
          $pass = $passed.Count
          $fail = $failed.Count
          # 历史基线至少58项；增加测试不能被误判。核心视觉与工程断言仍必须真实通过。
          if ($pass -lt 58 -or $fail -ne 0) {
            throw "Expected at least 58 PASS and 0 FAIL; actual $pass PASS / $fail FAIL"
          }
          # B5 acceptance: keep genuine orchestration/debug checks mandatory,
          # rather than allowing the generic shell PASS count to mask omissions.
          foreach ($required in @('S1-04 共用MPW主题及Dock视觉不修改工程',
                                   'S1界面设计真实WPF浅深主题和中央工作区截图',
                                   'P0-4 运行计划工程身份与Revision失效拒绝',
                                   'P0-4 跨页面MRK来源恢复与双Flow轨迹身份隔离',
                                   'P0-4 Studio真实CPU候选按钮到MRK运行及跨根页面/过期拒绝',
                                   'B5 调试暂停继续单步取消的真实Studio入口与空会话安全',
                                   'B5 活跃MRK断点单步继续取消真实WPF交互',
                                   'B5 活跃运行结果跨工程版本与多Flow隔离真实WPF反例',
                                   'S2 真实专业WPF能力目录、RAW强类型MEM编辑和授权边界')) {
            if (-not @($passed | Where-Object { $_.Line.Contains($required) }).Count) {
              throw "Required real WPF STA assertion missing: $required"
            }
          }
      - name: Upload real Studio WPF visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Studio-WPF-Visual-Review
          if-no-files-found: warn
          path: |
            Output/Release/x64/Studio-01-Home-Light.png
            Output/Release/x64/Studio-02-HMI-Light.png
            Output/Release/x64/Studio-03-Flow-Light.png
            Output/Release/x64/Studio-04-Home-Dark.png
      # 原稿单独打包；与真实WPF截图分开，便于逐页视觉差异审查。
      - name: Upload approved Studio 00-09 design references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Reference-Design-00-09
          if-no-files-found: error
          path: |
            DOCS/界面设计/*.png
      - name: Guard architecture dependencies
        shell: pwsh
        run: |
          # 两个脚本是PowerShell脚本，用throw表示失败；它们不设置LASTEXITCODE。
          # 与原先其他工具留下的LASTEXITCODE隔离，避免输出PASS却被误判。
          & .\Build\Verify-Structure.ps1
          if (-not $?) { throw 'Structure verification failed' }
          & .\Build\Verify-OwnerDependencies.ps1
          if (-not $?) { throw 'Owner dependency verification failed' }
      - name: Preserve STA self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-shell-self-test
          path: Output/Release/x64/StudioShellSelfTest.txt
          if-no-files-found: warn
