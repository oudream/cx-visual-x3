name: Supervision Migration / Lifecycle Removal Verification
on:
  push:
    branches: [master]
    paths:
      - 'Mechanism/Core/Modules/Service/**'
      - 'Mechanism/Core/CxVisual.Mechanism.Core.csproj'
      - 'Mechanism/Lifecycle/**'
      - 'Applications/Runtime.Host/**'
      - 'Tests/ArchitectureSmoke/**'
      - 'Services/Supervision/**'
      - '.github/workflows/supervision-migration.yml'
  workflow_dispatch:
jobs:
  lifecycle-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Verify migrated project structure
        shell: pwsh
        run: |
          if (Test-Path 'Mechanism/Lifecycle/CxVisual.Mechanism.Lifecycle.csproj') { throw 'Legacy Lifecycle project remains' }
          $core = Get-Content 'Mechanism/Core/CxVisual.Mechanism.Core.csproj' -Raw
          foreach ($name in @('MLCServiceModuleBase.cs','MLCServiceModuleContracts.cs','MLCServiceModuleConfiguration.cs')) {
            if (!(Test-Path "Mechanism/Core/Modules/Service/$name")) { throw "Missing $name" }
            if (!$core.Contains("Modules\Service\$name")) { throw "Core project missing compile entry: $name" }
          }
          $projects = Get-ChildItem -Recurse -Filter '*.csproj' | Where-Object { $_.FullName -notmatch 'ReferTo' }
          foreach ($p in $projects) {
            if ((Get-Content $p.FullName -Raw) -match 'ProjectReference[^\r\n]*CxVisual\.Mechanism\.Lifecycle\.csproj') { throw "Stale reference: $($p.FullName)" }
          }
      - name: Build Core / Runtime Host / Architecture Smoke
        shell: pwsh
        run: |
          foreach ($p in @('Mechanism/Core/CxVisual.Mechanism.Core.csproj','Applications/Runtime.Host/CxVisual.Runtime.Host.csproj','Tests/ArchitectureSmoke/CxVisual.Tests.ArchitectureSmoke.csproj')) {
            & msbuild.exe $p /t:Restore,Build /p:Configuration=Debug /p:Platform=x64 /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $p" }
          }
  supervision-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ hashFiles('Services/Supervision/go.mod') != '' }}
        with:
          go-version: '1.23'
          cache: false
      - name: Build Monitor and Daemon
        if: ${{ hashFiles('Services/Supervision/go.mod') != '' }}
        shell: bash
        working-directory: Services/Supervision
        run: |
          set -euo pipefail
          go version
          go env CGO_ENABLED
          if [[ -d hy ]]; then echo "::error::Unexpected legacy hy directory"; exit 1; fi
          if grep -R -n '"gogo/hy/' --include="*.go" cmd internal common; then
            echo "::error::Legacy import remains"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/supervision-bin"
          ext=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then ext=".exe"; fi
          go build -o "$RUNNER_TEMP/supervision-bin/monitor$ext" ./cmd/monitor
          go build -o "$RUNNER_TEMP/supervision-bin/daemon$ext" ./cmd/daemon
          go test -count=1 ./...
          # In addition to the regular three-OS suite, run Go's race
          # detector against the real owned-child stop/Wait integration on
          # Linux. Windows/macOS retain their normal build/test matrix.
          if [[ "$RUNNER_OS" == "Linux" && "$(go env CGO_ENABLED)" == "1" ]]; then
            go test -race -count=1 ./internal/launchjournal ./internal/daemonc ./internal/guardview ./internal/httpapi ./cmd/monitor ./cmd/daemon -run 'TestLaunch|TestUnreconciled|TestOwnedStop|TestRunProgramControlledStop|TestProgramWorkerGateStopControllerHandoff|TestOwnedStopDoesNotCrossGuardianGeneration|TestOrphan|TestStartupOrphan|TestGuard|TestTerminal|TestQueryRoutes'
          fi
          echo "Built and smoke-tested Monitor and Daemon for $RUNNER_OS"

  supervision-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate Vue H5
        working-directory: Services/Supervision/web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run build
          test -f dist/index.html
