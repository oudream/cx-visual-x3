name: CxVisual Config L1 Windows Build and Smoke
on:
  push:
    branches:
      - master
      - 'feat/config-l1-*'
      - 'feat/config-l2-l4-*'
      - 'fix/config-v1-1-*'
      - 'feat/config-prefix-*'
      - 'feat/vision-config-*'
  pull_request:
jobs:
  build-and-config-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build complete x64 solution
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild .\CxVisual.Unified.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "CxVisual full solution build failed" }
      - name: Run F19 concurrency and foundation behavior tests
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.FoundationSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Foundation/F19 worker tests failed" }
      - name: Run Config L1 and architecture behavior tests
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Architecture/ConfigL1 tests failed" }
          & .\Output\Release\x64\CxVisual.Runtime.Host.exe demo
          if ($LASTEXITCODE -ne 0) { throw "Runtime demo failed" }

          $visionOutput = & .\Output\Release\x64\CxVisual.Runtime.Host.exe vision-demo
          if ($LASTEXITCODE -ne 0) { throw "Vision real CPU demo failed" }
          $visionText = $visionOutput -join '|'
          if ($visionText -notmatch 'VisionDemo Revision=1 Defects=1' -or
              $visionText -notmatch 'VisionDemo Revision=2 Defects=0' -or
              $visionText -notmatch 'VisionDemo PASS') { throw "Vision demo output mismatch: $visionText" }
          & .\Output\Release\x64\CxVisual.Runtime.Host.exe save .\Output\Release\x64\Data\config-l1-smoke.xml
          if ($LASTEXITCODE -ne 0) { throw "Runtime save failed" }
          & .\Output\Release\x64\CxVisual.Runtime.Host.exe load .\Output\Release\x64\Data\config-l1-smoke.xml
          if ($LASTEXITCODE -ne 0) { throw "Runtime reload failed" }
      - name: Test generated WPF editors with real STA interactions
        shell: pwsh
        run: |
          & .\Output\Release\x64\CxVisual.Tests.ArchitectureSmoke.exe --config-wpf
          if ($LASTEXITCODE -ne 0) { throw "Config WPF UI interaction test failed" }
      - name: Full shared smoke diagnostics (F16 under concurrent development)
        shell: pwsh
        continue-on-error: true
        run: |
          & .\Build\Run-SmokeTests.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Existing shared smoke suite failed; investigate independently" }
