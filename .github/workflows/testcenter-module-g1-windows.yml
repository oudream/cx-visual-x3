name: TestCenter Module Center Five G1 Real WPF UI Windows Acceptance
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Tests/TestCenter/Manual/Module/**'
      - 'Tests/TestCenter/Verification/TCTCpuComputeUiSmoke.cs'
      - 'Tests/TestCenter/Verification/TCTSimulationStepUiSmoke.cs'
      - 'Tests/TestCenter/Verification/TCTServiceRequestUiSmoke.cs'
      - 'Tests/TestCenter/Verification/TCTConnectorLoopUiSmoke.cs'
      - 'Tests/TestCenter/Verification/TCTPlcReadOnlyUiSmoke.cs'
      - 'Tests/TestCenter/App.xaml.cs'
      - 'Tests/TestCenter/CxVisual.TestCenter.csproj'
      - 'Professional/Simulation/Modules/PSMAxisLinearModel.cs'
      - 'Professional/Vision/CxVisionRawCpuRunner.cs'
      - '.github/workflows/testcenter-module-g1-windows.yml'
jobs:
  four-real-software-loops:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore real TestCenter dependencies
        shell: pwsh
        run: |
          & msbuild.exe Tests/TestCenter/CxVisual.TestCenter.csproj /t:Restore /p:Configuration=Debug /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'TestCenter dependency Restore failed' }
      - name: Build actual x64 .NET Framework 4.8 TestCenter
        shell: pwsh
        run: |
          & msbuild.exe Tests/TestCenter/CxVisual.TestCenter.csproj /m:1 /nr:false /t:Build /p:Configuration=Debug /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'TestCenter G1 Build failed' }
      - name: Run five real operator WPF UIA flows on the same SHA
        shell: pwsh
        run: |
          $exe=(Resolve-Path Output/Debug/x64/CxVisual.TestCenter.exe).Path
          $dir=Split-Path $exe
          $checks=@(
            @{Argument='--module-cpu-ui-automation';Report='TestCenter-Cpu-UIA-Report.txt';Label='PASS TCT.Compute.UIA'},
            @{Argument='--module-simulation-ui-automation';Report='TestCenter-Simulation-UIA-Report.txt';Label='PASS TCT.Simulation.UIA'},
            @{Argument='--module-service-ui-automation';Report='TestCenter-Service-UIA-Report.txt';Label='PASS TCT.Service.UIA'},
            @{Argument='--module-connector-ui-automation';Report='TestCenter-Connector-UIA-Report.txt';Label='PASS TCT.Connector.UIA'},
            @{Argument='--module-plc-readonly-ui-automation';Report='TestCenter-PlcReadOnly-UIA-Report.txt';Label='PASS TCT.Plc.UIA'}
          )
          $failures=@()
          foreach($check in $checks) {
            try {
              $report=Join-Path $dir $check.Report
              Remove-Item $report -ErrorAction SilentlyContinue
              $p=Start-Process -FilePath $exe -ArgumentList @($check.Argument) -PassThru
              if(-not $p.WaitForExit(120000)) {
                try{$p.Kill()}catch{}
                throw "UIA timed out"
              }
              $p.Refresh()
              if(Test-Path $report){Get-Content $report}
              if($p.ExitCode -ne 0){throw "exit=$($p.ExitCode)"}
              if(-not(Test-Path $report)){throw "missing UIA report"}
              $lines=@(Get-Content $report)
              if(@($lines|Where-Object {$_.StartsWith($check.Label)}).Count -ne 1 -or
                 @($lines|Where-Object {$_.StartsWith('FAIL')}).Count -ne 0) {
                throw "actual PASS missing"
              }
              Write-Host "PASS $($check.Argument)"
            }
            catch {
              $message="$($check.Argument): $($_.Exception.Message)"
              $failures+= $message
              Write-Host "FAIL $message"
            }
          }
          if($failures.Count -ne 0) {
            throw "Real WPF G1 regression(s): $($failures -join '; ')"
          }
          Write-Host 'PASS Five G1 real WPF operator flows: Compute, Simulation, Service, Connector, PLC read-only'
      - name: Archive same-commit real UIA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testcenter-five-modules-real-g1-uia
          path: |
            Output/Debug/x64/TestCenter-Cpu-UIA-Report.txt
            Output/Debug/x64/TestCenter-Simulation-UIA-Report.txt
            Output/Debug/x64/TestCenter-Service-UIA-Report.txt
            Output/Debug/x64/TestCenter-Connector-UIA-Report.txt
            Output/Debug/x64/TestCenter-PlcReadOnly-UIA-Report.txt
          if-no-files-found: warn
